name: validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e .
      - run: ruff check .
      - run: black --check .
      - run: pytest -q
